<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order received — Olympic Mountain Ice Cream</title>
<meta name="robots" content="noindex">
<style>
:root{--midnight:#0a1424;--snow:#eef3f9;--glacier:#a9c0d8;--copper:#c08a4d;--copper-bright:#d9a96a}
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
body{min-height:100vh;display:grid;place-items:center;background:var(--midnight);color:var(--snow);font-family:-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;padding:2rem 1.25rem;text-align:center}
main{max-width:32rem}
img{display:block;width:min(260px,70vw);height:auto;margin:0 auto 2rem}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(1.8rem,6vw,2.6rem);line-height:1.15}
h1 em{color:var(--copper-bright)}
p{color:var(--glacier);margin-top:1rem}
p strong{color:var(--snow)}
a{color:var(--copper-bright)}
.links{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;margin-top:2rem}
.links a{color:var(--snow);text-decoration:none;border:1px solid rgba(217,169,106,.6);border-radius:999px;padding:.7rem 1.4rem;font-weight:600;min-height:44px;display:inline-flex;align-items:center}
.links a:hover,.links a:focus-visible{background:rgba(217,169,106,.16);border-color:var(--copper-bright)}
</style>
</head>
<body>
<main>
  <img src="/images/logo-cream-v2.webp" alt="Olympic Mountain Ice Cream" width="537" height="200">
  <div id="paid" hidden>
    <h1>Thank you, your order is <em>in</em></h1>
    <p id="paidLine">Payment received<span id="amount"></span>. Your receipt is on its way by email.</p>
    <p>We&rsquo;ll be in touch to confirm your flavors and delivery day. Questions? Call <a href="tel:+13604260696">360-426-0696</a>.</p>
  </div>
  <div id="pending">
    <h1>Thank you for your <em>order</em></h1>
    <p id="pendingText">Checking your payment&hellip;</p>
  </div>
  <div class="links">
    <a href="/wholesale">Back to wholesale ordering</a>
    <a href="/">Home page</a>
  </div>
</main>
<script>
/* Ask the shop API how the order stands (paid, free with a code, or bank payment still clearing),
   then empty the wholesale cart. */
(function(){
  var CART_KEY = "omic-wholesale-order-v1";
  var id = new URLSearchParams(location.search).get("session_id");
  var text = document.getElementById("pendingText");
  function notConfirmed(){
    text.innerHTML = "We couldn&rsquo;t confirm the payment from this page. If you paid, your receipt will arrive by email. Otherwise, please call us at <a href=\"tel:+13604260696\">360-426-0696</a>.";
  }
  if(!id){ notConfirmed(); return; }
  fetch("/api/order?session_id=" + encodeURIComponent(id), { headers: { Accept: "application/json" } })
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(!res.paid && !res.pending){ notConfirmed(); return; }
      try { localStorage.removeItem(CART_KEY); } catch(e){}
      var line = document.getElementById("paidLine");
      if(res.free){
        line.textContent = "No payment was needed: your code covered the order.";
      } else if(res.pending){
        line.textContent = "Your bank payment is on its way. Bank (ACH) payments take up to 4 business days to clear; your receipt arrives by email once it does.";
      } else if(typeof res.amount_total === "number" && res.currency){
        try {
          document.getElementById("amount").textContent = ": " + new Intl.NumberFormat("en-US", { style: "currency", currency: res.currency.toUpperCase() }).format(res.amount_total / 100);
        } catch(e){}
      }
      document.getElementById("pending").hidden = true;
      document.getElementById("paid").hidden = false;
      emailCreamery(res);
    })
    .catch(notConfirmed);

  /* Email the order to the creamery (the same Web3Forms inbox as the wholesale and contact forms), once per
     order: a reload or a second visit to this page doesn't send it again. The full order also stays on the
     payment in the Stripe Dashboard. */
  var WEB3FORMS_KEY = "23aff677-d78f-4997-9eb7-50157f79d02d";
  function emailCreamery(res){
    var o = res.order;
    if(!o || !o.id) return;
    var sentKey = "omic-order-emailed-" + o.id;
    try { if(localStorage.getItem(sentKey)) return; } catch(e){}
    var amount = "";
    try { amount = new Intl.NumberFormat("en-US", { style: "currency", currency: (res.currency || "usd").toUpperCase() }).format((res.amount_total || 0) / 100); } catch(e){}
    var status = res.free ? "PAID IN FULL WITH A CODE (nothing charged)"
      : res.pending ? "BANK PAYMENT PENDING: " + amount + " by ACH, clears in up to 4 business days"
      : "PAID: " + amount;
    var fd = new FormData();
    fd.append("access_key", WEB3FORMS_KEY);
    fd.append("subject", (res.pending ? "Wholesale order, bank payment pending: " : "Paid wholesale order: ") + (o.business || "website order") + (amount && !res.free ? " (" + amount + ")" : ""));
    fd.append("from_name", "Olympic Mountain Ice Cream online checkout");
    fd.append("payment", status);
    fd.append("business", o.business);
    fd.append("name", o.contact);
    fd.append("email", o.email);
    fd.append("phone", o.phone);
    fd.append("preferred_delivery", o.delivery_date || "Next available");
    fd.append("delivery_address", o.address);
    fd.append("order", o.lines);
    fd.append("notes", o.notes);
    fd.append("stripe_checkout_session", o.id);
    fetch("https://api.web3forms.com/submit", { method: "POST", headers: { Accept: "application/json" }, body: fd })
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.success){ try { localStorage.setItem(sentKey, "1"); } catch(e){} } })
      .catch(function(){});
  }
})();
</script>
</body>
</html>
